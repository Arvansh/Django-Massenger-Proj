{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massenger - Chat</title>
  <link rel="stylesheet" href="{% static "massenger/styles.css" %}">
</head>
<body class="chat-page">
  <div class="chat-container">
    <div class="user-list">
      <h3>Users</h3>
      <ul>
        {% for user in users %}
        <li><a href="?u={{ user.username }}"> {{ user.username }} </a></li>
        {% endfor %}
      </ul>
    </div>
    <div class="chat-box">
      <div class="messages">
        {% for  message in messages %}
        <strong>{{ message.user.username }}</strong>
        <div class="{% if message.sender == request.user %} sent {% else %}recieved{% endif %}">
          <p> {{message.content}} </p>
          <span> {{ message.timestamp|date:"H:i" }} </span>
        </div>
        <p class="no-messages">NO messages yet</p>
        {% endfor %}
      </div>
    </div>
    <form method="POST" class="message-form">
      {% csrf_token %}
      <input type="text" name="content" placeholder="Type a message..." required>
      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
